services:
  - type: web
    name: richo-ekub-bot
    runtime: node
    plan: free
    region: oregon
    rootDir: bot
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: VERITAS_API_URL
        value: https://verifyapi.leulzenebe.pro
      - key: BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VERITAS_API_KEY
        sync: false
      - key: VERITAS_API_KEYS
        sync: false

  - type: web
    name: richo-lottery-admin
    runtime: static
    plan: free
    region: oregon
    rootDir: admin
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    envVars:
